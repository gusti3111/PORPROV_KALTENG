<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portal informasi PORPROV XIII Kalimantan Tengah 2026."
    />
    <meta name="theme-color" content="#102b49" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("porprov-theme-manual");
          if (savedTheme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <link rel="icon" type="image/jpeg" href="/iconporKalteng.jpeg" />
    <title>PORPROV XIII Kalimantan Tengah 2026</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
